<nav class="navbar bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/manage-applications" style="margin-left: 1%;"><img src="briefcase-solid-full.svg" style="max-height: 30px;"/> Job Tracker</a>
    <div class="navbar-action-items">
        <button class="btn btn-dark" type="submit">+ Add Application</button>
        <button type="button" class="btn btn-light logout-btn" (click)="logout()"><img src="logout.svg" style="max-height: 18px;"/> Logout</button>
    </div>
  </div>
</nav>

<div class="row app-summary">
    <div class="card shadow" *ngFor="let item of cardContentList">
        <div class="card-body">
            <h5 class="card-title">{{item.cardTitle}}</h5>
            <p class="card-text">{{item.count}}</p>
            <p class="card-text">{{item.cardSubText}}</p>
        </div>
    </div>
</div>

<div class="row application-data">
<table mat-table [dataSource]="applications" class="mat-elevation-z8">

  <ng-container matColumnDef="companyName">
    <th mat-header-cell *matHeaderCellDef> Company </th>
    <td mat-cell *matCellDef="let element"> {{element.companyName}} </td>
  </ng-container>

    <ng-container matColumnDef="jobTitle">
    <th mat-header-cell *matHeaderCellDef> Role </th>
    <td mat-cell *matCellDef="let element"> {{element.jobTitle}} </td>
    </ng-container>

    <ng-container matColumnDef="location">
    <th mat-header-cell *matHeaderCellDef> Location </th>
    <td mat-cell *matCellDef="let element"> {{element.location}} </td>
    </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef> Status </th>
    <td mat-cell *matCellDef="let element"> {{element.status}} </td>
  </ng-container>

  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef> Action </th>
    <td mat-cell *matCellDef="let element"> - </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

</div>
